<div class="overflow-y-scroll w-screen h-screen antialiased">
  <div class="flex flex-col relative w-screen">
    <div id="menu" class="bg-gray-100 min-h-screen z-10 w-64 fixed left-0 h-screen overflow-y-scroll">
      <div id="logo" class="my-4 px-6">
        <a class="hidden md:flex" routerLink="/">
          <img src="assets/images/riudicc/logo.png" alt="RIUDICC Logo" class="h-15 w-auto" />
        </a>
        <p class="text-slate-500 text-sm">Manage your actions and activities</p>
      </div>
      <div id="profile" class="px-6 py-10">
        <p class="text-slate-500">Bienvenido,</p>
        <span class="text-sm md:text-base font-bold">{{ user()?.fullName }}</span>
      </div>
      <div id="nav" class="w-full px-6">
        <p class="px-2 pb-2 text-xs font-semibold uppercase tracking-wider text-slate-500">Administración</p>
        @if (isAdmin() || isSuper()) {
          <item-bar-menu [link]="'/admin/usuarios'" [title]="'Usuarios'" [subtitle]="'Crear usuarios y editores'">
            <svg icon class="text-slate-700 group-hover:text-white group-[.active]:text-white" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v3h16v-3c0-2.76-3.58-5-8-5Z"/></svg>
          </item-bar-menu>
          <item-bar-menu [link]="'/admin/observatorio'" [title]="'Observatorio'" [subtitle]="'Cargos y miembros'">
            <svg icon class="text-slate-700 group-hover:text-white group-[.active]:text-white" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20a10 10 0 0 0 0-20Zm1 5v4.4l3 1.8l-1 1.7l-4-2.4V7h2Z"/></svg>
          </item-bar-menu>
        }
        @if (isAdmin()) {
          <item-bar-menu [link]="'/admin/banners'" [title]="'Banners'" [subtitle]="'Listado de Banners'">
            <svg icon class="text-slate-700 group-hover:text-white group-[.active]:text-white" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M6 22q-.825 0-1.412-.587T4 20V4q0-.825.588-1.412T6 2h12q.825 0 1.413.588T20 4v16q0 .825-.587 1.413T18 22zm0-2h12V4H6zm1-2h10l-3.45-4.5l-2.3 3l-1.55-2z"/></svg>
          </item-bar-menu>
        }
        <item-bar-menu [link]="'/admin/noticias'" [title]="'Noticias'" [subtitle]="'Listado de Noticias'">
          <svg icon class="text-slate-700 group-hover:text-white group-[.active]:text-white" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M4 21q-.825 0-1.412-.587T2 19V3l1.675 1.675L5.325 3L7 4.675L8.675 3l1.65 1.675L12 3l1.675 1.675L15.325 3L17 4.675L18.675 3l1.65 1.675L22 3v16q0 .825-.587 1.413T20 21z"/></svg>
        </item-bar-menu>
        <item-bar-menu [link]="'/admin/universidades'" [title]="'Instituciones'" [subtitle]="'Listado de Instituciones'">
          <svg icon class="text-slate-700 group-hover:text-white group-[.active]:text-white" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M21 10a1 1 0 0 0 1-1V6a1 1 0 0 0-.684-.948l-9-3a1 1 0 0 0-.632 0l-9 3A1 1 0 0 0 2 6v3a1 1 0 0 0 1 1h1v7h2v-7h2v7h2v-7h4v7h2v-7h2v7h2v-7h1Z"/></svg>
        </item-bar-menu>
        <button class="btn btn-ghost text-accent w-full" [routerLink]="['/auth']" (click)="authService.logout()">Cerrar sesión</button>
      </div>
    </div>
  </div>
  <div class="flex-1 ml-64 pt-5 px-5 pb-8"><router-outlet /></div>
</div>
