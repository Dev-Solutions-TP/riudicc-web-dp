<div class="overflow-x-auto">
  <table class="table table-zebra">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Roles</th>
        <th>Estado</th>
        <th><span class="sr-only">Acciones</span></th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id) {
        <tr>
          <td class="font-medium">{{ user.fullName }}</td>
          <td>{{ user.email }}</td>
          <td>
            <div class="flex flex-wrap gap-1">
              @for (role of user.roles; track role) {
                <span class="badge badge-outline">{{ role }}</span>
              }
            </div>
          </td>
          <td>
            <span
              class="badge"
              [class.badge-success]="user.isActive"
              [class.badge-error]="!user.isActive"
            >{{ user.isActive ? 'Activo' : 'Inactivo' }}</span>
          </td>
          <td>
            <div class="flex flex-wrap justify-end gap-2">
              <a class="btn btn-sm btn-outline" [routerLink]="['/admin/usuarios', user.id]">Editar</a>
              <button
                class="btn btn-sm"
                [class.btn-warning]="user.isActive"
                [class.btn-success]="!user.isActive"
                (click)="toggleActive.emit(user)"
              >{{ user.isActive ? 'Desactivar' : 'Reactivar' }}</button>
            </div>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="5" class="py-10 text-center text-base-content/70">No hay usuarios para mostrar.</td></tr>
      }
    </tbody>
  </table>
</div>
