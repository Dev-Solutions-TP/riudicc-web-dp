<div class="flex flex-wrap items-center gap-4">
  <div>
    <h1 class="text-2xl font-bold">Noticias</h1>
    <h3 class="text-lg">
      Administra noticias, editar contenido
    </h3>
  </div>

  <div class="flex-1"></div>

  @if (authService.canCreateContent()) {
  <button
    class="btn btn-primary"
    routerLink="/admin/noticias/new"
  >
    Nueva noticia
  </button>
  }
</div>

<div class="divider"></div>



@if (noticiasResource.isLoading()) {
<div class="flex justify-center p-12">
  <span class="loading loading-spinner loading-lg"></span>
</div>
} @else if (noticiasResource.error()) {
<div class="alert alert-error">No se pudo cargar el listado de noticias.</div>
} @else {
<div class="flex flex-wrap items-center gap-3 mb-4">
  <p>Total de noticias: <strong>{{ noticiasResource.value()?.count ?? 0 }}</strong></p>
  <div class="flex-1"></div>
  <label class="flex items-center gap-2">
    <span class="text-sm">Filas por página</span>
    <select
      class="select select-bordered select-sm w-24"
      [value]="noticiasPerPage()"
      (change)="noticiasPerPage.set(+selectPerPage.value)"
      #selectPerPage
    >
      <option value="10">10</option>
      <option value="20">20</option>
      <option value="50">50</option>
    </select>
  </label>
</div>

<!-- Listado -->
<div class="overflow-x-auto mb-5">
  <noticias-table [noticias]="noticiasResource.value()?.items ?? []" />
</div>

<app-pagination
  [pages]="noticiasResource.value()?.pages ?? 0"
  [currentPage]="paginationService.currentPage()"
/>


}
