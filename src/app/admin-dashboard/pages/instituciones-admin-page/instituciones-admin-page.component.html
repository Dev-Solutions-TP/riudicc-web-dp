<div class="flex flex-wrap items-center gap-4">
  <div>
    <h1 class="text-2xl font-bold">Instituciones</h1>
    <h3 class="text-lg">Administra las instituciones registradas.</h3>
  </div>

  <div class="flex-1"></div>

  @if (authService.canCreateContent()) {
    <button
      class="btn btn-primary"
      routerLink="/admin/universidades/new"
    >
      Nueva institución
    </button>
  }
</div>

<div class="divider"></div>

@if (instResource.isLoading()) {
  <div class="flex justify-center p-12">
    <span class="loading loading-spinner loading-lg"></span>
  </div>
} @else if (instResource.error()) {
  <div class="alert alert-error">No se pudo cargar el listado de instituciones.</div>
} @else {
  <div class="mb-4 flex flex-wrap items-center gap-3">
    <p>Total de instituciones: <strong>{{ instResource.value()?.count ?? 0 }}</strong></p>
    <div class="flex-1"></div>
    <label class="flex items-center gap-2">
      <span class="text-sm">Filas por página</span>
      <select
        class="select select-bordered select-sm w-24"
        [value]="institucionesPerPage()"
        (change)="institucionesPerPage.set(+selectPerPage.value)"
        #selectPerPage
      >
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
    </label>
  </div>

  <div class="mb-5">
    <instituciones-table [insituciones]="instResource.value()?.items ?? []" />
  </div>

  <app-pagination
    [pages]="instResource.value()?.pages ?? 0"
    [currentPage]="paginationService.currentPage()"
  />
}
